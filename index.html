<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Family Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
<script defer src="chart.umd.js" onload="window.chartReady && window.chartReady()"
        onerror="window.chartFailed = true; window.chartReady && window.chartReady()"></script>
</head>
<body>
<header id="top" class="top"></header>
<div id="notices"></div>
<main>
  <section id="screen-add" class="screen" aria-label="Add"></section>
  <section id="screen-budget" class="screen" aria-label="Budget"></section>
  <section id="screen-savings" class="screen" aria-label="Savings"></section>
  <section id="screen-settings" class="screen" aria-label="Settings"></section>
  <section id="screen-setup" class="screen" aria-label="Setup"></section>
</main>

<nav id="nav" class="nav" aria-label="Main">
  <button type="button" data-a="go" data-to="budget">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
    <span>Budget</span></button>
  <button type="button" data-a="go" data-to="add">
    <span class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
    <span>Add</span></button>
  <button type="button" data-a="go" data-to="savings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
    <span>Savings</span></button>
</nav>

<div id="setbar" class="setbar hidden" role="region" aria-label="Unsaved settings">
  <span>⚠️ Unsaved changes</span>
  <button type="button" class="btn sm" data-a="setDiscard">Discard</button>
  <button type="button" class="btn sm pri" data-a="setSave">Save changes</button>
</div>

<div id="sheet" class="sheet hidden">
  <div class="sheet-bd" data-a="sheetClose"></div>
  <div class="sheet-in" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="m-text">
  <div class="mbox"><p id="m-text"></p>
    <div class="mbtns"><button type="button" id="m-no" class="btn">Cancel</button><button type="button" id="m-yes" class="btn pri">Yes</button></div></div>
</div>
<input type="file" id="imp-file" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
